name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        # Use the maintained upload-artifact v4 to avoid the v3 deprecation
        uses: actions/upload-artifact@v4
        with:
          name: pages
          path: ./    # <-- ideally set this to your built site dir, e.g. ./public or ./docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
