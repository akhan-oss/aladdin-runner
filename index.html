<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Aladdin: Rooftop Runner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <h1>Aladdin: Rooftop Runner</h1>
    <p class="hint">Press Space / Tap to jump. Avoid the obstacles and rack up points.</p>
    <canvas id="game" width="800" height="300" aria-label="Aladdin Rooftop Runner game canvas"></canvas>
    <div id="overlay" class="overlay hidden"></div>
    <p class="credits">Built with HTML5 canvas · Open-source</p>
  </main>
  <script src="game.js" defer></script>
</body>
</html>
